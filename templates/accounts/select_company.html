{% extends "base.html" %}

{% block title %}{{ ui.select_company_page_title }}{% endblock %}

{% block page_title %}
<span class="d-flex align-items-center gap-2">
    <i class="bi bi-building" style="color:var(--accent);"></i>
    {{ ui.select_company_title }}
</span>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <p class="text-muted mb-4">{{ ui.select_company_subtitle }}</p>
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="list-group mb-4">
                        {% for company in companies %}
                        <label class="list-group-item list-group-item-action d-flex align-items-center gap-3">
                            <input class="form-check-input mt-0" type="radio" name="company_id" value="{{ company.pk }}" required>
                            <span>
                                <strong>{{ company.code }}</strong>
                                <span class="text-muted">— {{ company.name }}</span>
                            </span>
                        </label>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-primary">{{ ui.select_company_submit }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

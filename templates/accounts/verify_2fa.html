<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ui.verify_2fa_page_title }}</title>
    {% if is_rtl %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    {% else %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    {% endif %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4f9; }
        .card-box { max-width: 390px; width: 100%; background: #fff; border-radius: 18px; padding: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 30px rgba(0,0,0,.08); }
    </style>
</head>
<body>
<div class="card-box">
    <div class="text-center mb-3"><i class="bi bi-shield-lock-fill fs-2 text-primary"></i></div>
    <h2 class="h5 fw-bold">{{ ui.verify_2fa_title }}</h2>
    <p class="text-muted small">{{ subtitle }}</p>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label class="form-label fw-semibold">{{ ui.verify_2fa_code_label }}</label>
        <input type="text" name="otp_code" class="form-control mb-3" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="{{ ui.verify_2fa_code_ph }}" required autofocus>
        <button type="submit" class="btn btn-primary w-100 mb-2">{{ ui.verify_2fa_submit }}</button>
    </form>
    <form method="post" class="mt-2">
        {% csrf_token %}
        <input type="hidden" name="action" value="resend">
        <button type="submit" class="btn btn-link w-100">{{ ui.verify_2fa_resend }}</button>
    </form>
    <a href="{% url 'logout' %}" class="btn btn-outline-secondary w-100 mt-2">{{ ui.nav_logout }}</a>
</div>
</body>
</html>

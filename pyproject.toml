[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
    "accounts_app",
    "audit_app",
    "arabic_compliance_dashboard",
    "config",
    "config.example",
    "reports_app",
    "mail_app",
    "exports_app",
    "tests",
    "*.py",
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "**/media",
    "**/staticfiles",
]
executionEnvironments = [{ root = ".", extraPaths = ["."] }]

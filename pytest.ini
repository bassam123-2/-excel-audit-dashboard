[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
testpaths =
    accounts_app/tests
    audit_app/tests
    reports_app/tests
    tests
python_files = tests.py test_*.py *_tests.py
addopts = --tb=short -ra
markers =
    unit: fast isolated logic tests
    integration: HTTP client / view tests
    regression: smoke tests for new feature scenarios
    slow: heavier tests (upload/analyze flows)
